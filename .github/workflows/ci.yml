name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Lint (errors fail the build; the legacy `any` list warns), format,
      # and typecheck — the same gate the local `npm run lint`/`format:check`
      # run, now enforced on push to master (see docs/prd/ci-workflows-style-gate.md).
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mainsail-latest.zip
          path: dist/mainsail.zip

  cypress:
    name: E2E (Docker harness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the application
        run: npm run build

      # Boot the Docker dev harness: built frontend served by nginx against a
      # real (containerized) Moonraker 0.11.0.
      - name: Start Docker harness
        run: |
          cd docker
          docker compose up -d --wait

      - name: Cypress run (against harness at :8080)
        uses: cypress-io/github-action@v6
        with:
          config-file: cypress.config.ts
          spec: cypress/e2e/dashboard.cy.ts
          env: baseUrl=http://localhost:8080

      - name: Tear down Docker harness
        if: always()
        run: |
          cd docker
          docker compose down -v

  cypress-mock:
    name: E2E (Mock CNC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the application
        run: npm run build

      # Boot the fake Moonraker, which also serves the built frontend from
      # dist/ same-origin (see mock-moonraker.cjs). The cnc-mock spec uses
      # absolute URLs against :7125, so no baseUrl override is needed.
      - name: Start mock Moonraker
        run: |
          node mock-moonraker.cjs > /tmp/mock-moonraker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7125/server/info > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7125/server/info > /dev/null
          curl -sf http://127.0.0.1:7125/ > /dev/null

      - name: Cypress run (against mock at :7125)
        uses: cypress-io/github-action@v6
        with:
          config-file: cypress.config.ts
          spec: cypress/e2e/cnc-mock.cy.ts

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage floors
        # Gates the scoped CNC floors + global backstop declared in
        # vite.config.ts (see docs/prd/test-coverage-expansion.md R1/R5).
        run: npm run test:coverage
