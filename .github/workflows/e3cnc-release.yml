name: E3CNC Release

# Builds the E3CNC Mainsail fork into a CI-produced mainsail.zip and attaches it
# to a GitHub Release. This is the artifact the e3cnc-installer downloads
# (ADR-0001: Mainsail is never built on the target). Unlike upstream's
# release.yml, this uses the default GITHUB_TOKEN -- no PAT, no FTP/CDN deploy,
# no semantic-release/version bumping -- so it runs on the fork as-is.
#
# Tag scheme: e3cnc-mainsail-vX.Y.Z (namespaced, distinct from upstream v* tags;
# matches cliff.toml tag_pattern and the latest_tag lookup in release.yml).
#
# Trigger: Actions -> "E3CNC Release" -> Run workflow, give a tag (e.g.
# e3cnc-mainsail-v0.10.7). The tag is created at the commit this runs on.
# Bump package.json "version" to X.Y.Z in the release commit itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. e3cnc-mainsail-v0.10.7)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tag matches package.json version
        run: |
          # Invariant: the requested tag e3cnc-mainsail-vX.Y.Z must match the
          # package.json "version" (X.Y.Z). See docs/prd/release-version-drift-guard.md.
          if ! [[ "${{ inputs.tag }}" =~ ^e3cnc-mainsail-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag must match e3cnc-mainsail-vX.Y.Z (got: ${{ inputs.tag }})"
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag version: $TAG_VERSION, package.json version: $PKG_VERSION"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version $TAG_VERSION does not match package.json version $PKG_VERSION. Bump package.json \"version\" in the release commit first."
            exit 1
          fi
          # Soft check (non-fatal): warn if docs don't carry a matching header
          if ! grep -qE "^## \[e3cnc-mainsail-v$TAG_VERSION\]" RELEASES.md CHANGELOG.md 2>/dev/null; then
            echo "::warning::Neither RELEASES.md nor CHANGELOG.md has an 'e3cnc-mainsail-v$TAG_VERSION' header — you may want to add release notes."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build (produces dist/mainsail.zip)
        run: npm run build

      - name: Verify artifact
        run: test -f dist/mainsail.zip && ls -l dist/mainsail.zip

      - name: Create release and attach mainsail.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            E3CNC Mainsail build (CI-produced artifact, ADR-0001).

            The e3cnc-installer's Stack Manifest pins `MAINSAIL_REF` to this tag
            and downloads `mainsail.zip` from this release. Never built on target.
          files: dist/mainsail.zip
