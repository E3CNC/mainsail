# E3CNC Mainsail fork update-manager snippet for Moonraker
# ------------------------------------------------------------
# Add this block to your moonraker.conf (~/printer_data/config/moonraker.conf)
# to register this fork with Moonraker's update manager.
#
# Recommended: type web. This fork publishes mainsail.zip to GitHub
# Releases (tags like e3cnc-v0.1.0, produced by the "E3CNC Release"
# workflow), which is the artifact shape Moonraker's web updater consumes.
# No manual clone needed.
#
# Restart Moonraker after editing. machine.update.status should then list a
# "mainsail" entry owned by E3CNC. Upgrade with machine.update.upgrade.
#
# NOTE: this UI currently has no update screen (no updateManager store
# module, no update dialog). Updates apply through the Moonraker API or
# another client that renders update status.
# ------------------------------------------------------------

[update_manager]
refresh_interval: 168
enable_auto_refresh: True

[update_manager client mainsail]
type: web
channel: stable
repo: E3CNC/mainsail
path: ~/mainsail

# ------------------------------------------------------------
# Alternative: git_repo (only for installs cloned with git, not zip installs)
# Moonraker validates the local path as a git repo, so this fails when the
# UI was installed from a release zip. Match primary_branch to the branch
# you have checked out (run: git branch --show-current).
# ------------------------------------------------------------

# [update_manager mainsail]
# type: git_repo
# channel: dev
# path: ~/mainsail
# origin: https://github.com/E3CNC/mainsail.git
# primary_branch: develop
