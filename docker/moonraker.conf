[server]
host = 0.0.0.0
port = 7125

[database]
dbtype = sqlite
name = /data/database/moonraker.db

[log]
config = /data/logs/moonraker.log
log_size = 1000000

[authorization]
trusted_clients =
    0.0.0.0/0
cors_domains =
    http://localhost:8080
    http://127.0.0.1:8080
    *

[update_manager]
refresh_interval: 168
enable_auto_refresh: True

[update_manager mainsail]
type: web
channel: stable
repo: E3CNC/mainsail
path: /home/dietpi/mainsail
