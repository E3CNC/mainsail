services:
  nginx:
    image: nginx:alpine
    container_name: mainsail-nginx
    ports:
      - '8080:80'
    volumes:
      # Mount the built frontend (npm run build -> dist/). Read-only.
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - moonraker
    restart: unless-stopped
    networks:
      - mainsail-network

  moonraker:
    build: .
    container_name: moonraker
    restart: unless-stopped
    ports:
      - '7125:7125'
      - '7126:7126'
    volumes:
      - moonraker_data:/data
    environment:
      - TZ=UTC
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7125/server/info']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mainsail-network

volumes:
  moonraker_data:

networks:
  mainsail-network:
    driver: bridge
