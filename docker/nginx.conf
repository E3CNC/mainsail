server {
    listen 80 default_server;

    # Serves the Mainsail frontend mounted from the repo-local dist/ build.
    root /usr/share/nginx/html;
    index index.html;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Moonraker WebSocket (service name resolves inside the compose network)
    location /websocket {
        proxy_pass http://moonraker:7125/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Moonraker API endpoints
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://moonraker:7125$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}